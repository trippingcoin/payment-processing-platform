name: payment-processing-platform

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    entrypoint: /opt/kafka/bin/kafka-topics.sh
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "${KAFKA_PAYMENTS_TOPIC:-payments.events.v1}", "--partitions", "3", "--replication-factor", "1", "--config", "min.insync.replicas=1"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  outbox-worker:
    build:
      context: .
      args:
        SERVICE: outbox-worker
    environment:
      DB_DSN: postgres://${POSTGRES_USER:-payments}:${POSTGRES_PASSWORD:-payments}@postgres:5432/${POSTGRES_DB:-payments}?sslmode=disable
      DB_MAX_OPEN_CONNS: 5
      DB_MIN_IDLE_CONNS: 1
      KAFKA_BROKERS: kafka:9092
      KAFKA_PAYMENTS_TOPIC: ${KAFKA_PAYMENTS_TOPIC:-payments.events.v1}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_PUBLISH_TIMEOUT: ${OUTBOX_PUBLISH_TIMEOUT:-5s}
      OUTBOX_RETRY_BASE: ${OUTBOX_RETRY_BASE:-1s}
      OUTBOX_RETRY_MAX: ${OUTBOX_RETRY_MAX:-1m}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations/payment-service:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-payments}:${POSTGRES_PASSWORD:-payments}@postgres:5432/${POSTGRES_DB:-payments}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-payments}
    volumes:
      - ./deploy/docker-compose/seed.sql:/seed.sql:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER:-payments}
      - -d
      - ${POSTGRES_DB:-payments}
      - -f
      - /seed.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_PORT: 8080
      APP_VERSION: ${APP_VERSION:-v0.1.0}
      ENV: ${ENV:-development}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-development-token}
      DB_DSN: postgres://${POSTGRES_USER:-payments}:${POSTGRES_PASSWORD:-payments}@postgres:5432/${POSTGRES_DB:-payments}?sslmode=disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MIN_IDLE_CONNS: ${DB_MIN_IDLE_CONNS:-2}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
